version: 2
updates:
  # ── Go CLI ───────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    commit-message:
      prefix: build
      include: scope

  # ── npm: web app ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: build
      include: scope
    groups:
      # react and react-dom must resolve to the exact same version or
      # react-dom throws at mount (React error #527) and the app renders
      # nothing. Keep them in a single PR so they never drift apart.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # ── npm: landing site ────────────────────────────────────
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: build
      include: scope

  # ── npm: root (semantic-release tooling) ─────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: build
      include: scope

  # ── GitHub Actions ───────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci
      include: scope

  # ── Docker: CLI images (Dockerfile + Dockerfile.goreleaser)
  - package-ecosystem: docker
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: build
      include: scope

  # ── Docker: web image ────────────────────────────────────
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: build
      include: scope
